<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Utili - Calcolatore Modificatore Difesa</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 6px;
            text-align: center;
            font-weight: 700;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

            input:focus, select:focus {
                border-color: var(--accent);
            }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

            button:hover {
                background-color: var(--accent-hover);
            }

        .result-box {
            margin-top: 24px;
            padding: 16px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            text-align: center;
            display: none;
        }

            .result-box.active {
                display: block;
            }

        .result-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .result-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent);
        }

        .result-details {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Modificatore Difesa</h1>
        <p class="subtitle">Calcolo istantaneo senza fronzoli</p>

        <div class="input-group">
            <label for="soglia">Soglia Base</label>
            <select id="soglia">
                <option value="6.0">6.0 (Standard)</option>
                <option value="6.25">6.25</option>
                <option value="6.5">6.5</option>
            </select>
        </div>

        <div class="input-group">
            <label for="votoPortiere">Voto Portiere</label>
            <input type="number" step="0.5" id="votoPortiere" placeholder="Es. 6" required>
        </div>

        <div class="input-group">
            <label for="votiDifensori">Voti Difensori (separa con virgola o spazio)</label>
            <input type="text" id="votiDifensori" placeholder="Es. 6.5, 6, 5.5, 7" required>
        </div>

        <button onclick="calcolaModificatore()">Calcola Bonus</button>

        <div id="resultBox" class="result-box">
            <div class="result-title">Bonus Ottenuto</div>
            <div id="bonusOutput" class="result-value">+0</div>
            <div id="detailsOutput" class="result-details"></div>
        </div>
    </div>

    <script>
        function calcolaModificatore() {
            const soglia = parseFloat(document.getElementById('soglia').value);
            const votoP = parseFloat(document.getElementById('votoPortiere').value);
            const rawVotiD = document.getElementById('votiDifensori').value;

            if (isNaN(votoP)) {
                alert("Inserisci un voto valido per il portiere.");
                return;
            }

            // Pulisce l'input dei difensori (gestisce virgole, punti e spazi)
            const votiD = rawVotiD
                .replace(/,/g, '.')
                .split(/[\s+]+/)
                .map(v => parseFloat(v))
                .filter(v => !isNaN(v));

            if (votiD.length < 3) {
                alert("Devi inserire almeno 3 voti di difensori validi.");
                return;
            }

            // Ordina i voti dei difensori dal più alto al più basso e prende i migliori 3
            votiD.sort((a, b) => b - a);
            const miglioriTre = votiD.slice(0, 3);

            // Calcola la media (Portiere + i 3 migliori difensori) / 4
            const somma = votoP + miglioriTre.reduce((acc, curr) => acc + curr, 0);
            const media = somma / 4;

            // Calcola la differenza rispetto alla soglia
            const diff = media - soglia;
            let bonus = 0;

            if (diff >= 1.0) {
                bonus = 3;
            } else if (diff >= 0.5) {
                bonus = 2;
            } else if (diff > 0) {
                bonus = 1;
            } else {
                bonus = 0;
            }

            // Mostra il risultato a schermo
            const resultBox = document.getElementById('resultBox');
            const bonusOutput = document.getElementById('bonusOutput');
            const detailsOutput = document.getElementById('detailsOutput');

            bonusOutput.textContent = `+${bonus}`;
            detailsOutput.innerHTML = `Media reparto: <strong>${media.toFixed(2)}</strong> (Migliori 3: ${miglioriTre.join(', ')})`;
            resultBox.classList.add('active');
        }
    </script>
</body>
</html>
